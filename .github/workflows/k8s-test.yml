name: Kubernetes Test Pipeline

on:
  workflow_dispatch: # Allows you to trigger it manually via the GitHub Actions tab

jobs:
  k8s-job:
    runs-on: self-hosted

    steps:
      - name: Check out code repository
        uses: actions/checkout@v4

      # 1. Generate a random ID using the first 7 characters of your commit hash
      - name: Generate Random ID
        id: vars
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          Add-Content -Path $env:GITHUB_ENV -Value "POD_ID=$shortSha"
        shell: powershell

      # 2. Create the Pod configuration file dynamically and apply it
      - name: Create and Apply Pod Manifest
        run: |
          $manifest = @"
          apiVersion: v1
          kind: Pod
          metadata:
            name: mypod-$($env:POD_ID)
            namespace: default
            labels:
              name: mypod
          spec:
            containers:
            - name: mypod
              image: rancher/hello-world
          "@
          
          # Save the manifest to a temporary file
          Set-Content -Path "test-pod.yml" -Value $manifest
          
          # Apply it to your local cluster
          kubectl apply -f test-pod.yml
        shell: powershell

      # 3. Wait a few seconds and check the status
      - name: Verify Pod Status
        run: |
          Start-Sleep -Seconds 5
          kubectl get pods -n default
        shell: powershell
