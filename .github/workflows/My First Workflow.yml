name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t hello-world-nginx:v1 .

      - name: Run the Docker container
        run: |
          docker run -d -p 8080:80 hello-world-nginx:v1
          # Add a sleep or a curl command here if you want to verify 
          # the container is actually running before the job ends
          sleep 5
          docker ps
