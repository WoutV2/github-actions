name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Log into the GitHub Container Registry securely
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push using the marketplace action discussed earlier
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/hello-world-nginx:v1
            ghcr.io/${{ github.repository }}/hello-world-nginx:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/hello-world-nginx:${{ github.sha }}
