name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Native PowerShell lowercase conversion
      - name: Lowercase repository name
        run: |
          $repo = "${{ github.repository }}".ToLower()
          Add-Content -Path $env:GITHUB_ENV -Value "REPO_LOWERCASE=$repo"
        shell: powershell

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}/hello-world-nginx:v1
            ghcr.io/${{ env.REPO_LOWERCASE }}/hello-world-nginx:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LOWERCASE }}/hello-world-nginx:${{ github.sha }}
