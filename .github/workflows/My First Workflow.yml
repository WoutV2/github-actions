name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # New Step: Convert the repository name to lowercase
      - name: Lowercase repository name
        run: |
          echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Use the new lowercase environment variable here
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}/hello-world-nginx:v1
            ghcr.io/${{ env.REPO_LOWERCASE }}/hello-world-nginx:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LOWERCASE }}/hello-world-nginx:${{ github.sha }}
